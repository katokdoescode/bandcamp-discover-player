name: CI

# Every push to main and every pull request: typecheck, tests, both builds, Mozilla lint.
# After a green run on main, a release with the Chrome and Firefox zips is published
# when package.json carries a version that has no release yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build and zip Chrome (MV3)
        run: npm run zip

      - name: Build and zip Firefox (MV2) with sources
        run: npm run zip:firefox

      - name: Lint Firefox build (addons-linter)
        run: npm run lint:firefox

      # upload-artifact skips hidden folders such as .output, so collect the zips first.
      - name: Collect zips
        run: mkdir -p dist && cp .output/*.zip dist/

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      # Store submissions run only once their API keys are added as repository secrets.
      HAS_AMO_KEYS: ${{ secrets.FIREFOX_JWT_ISSUER != '' && secrets.FIREFOX_JWT_SECRET != '' }}
      HAS_CWS_KEYS: ${{ secrets.CHROME_EXTENSION_ID != '' && secrets.CHROME_PUBLISHER_ID != '' && secrets.CHROME_SERVICE_ACCOUNT_EMAIL != '' && secrets.CHROME_SERVICE_ACCOUNT_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in package.json to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.exists.outputs.skip == 'false'
        with:
          name: extension-zips
          path: dist

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - uses: actions/setup-node@v7
        if: steps.exists.outputs.skip == 'false' && (env.HAS_AMO_KEYS == 'true' || env.HAS_CWS_KEYS == 'true')
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.exists.outputs.skip == 'false' && (env.HAS_AMO_KEYS == 'true' || env.HAS_CWS_KEYS == 'true')
        run: npm ci

      - name: Submit to addons.mozilla.org
        if: steps.exists.outputs.skip == 'false' && env.HAS_AMO_KEYS == 'true'
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          npx wxt submit \
            --firefox-zip dist/*-firefox.zip \
            --firefox-sources-zip dist/*-sources.zip \
            --firefox-extension-id "discover-player@bandcamp-streaming-plugin" \
            --firefox-channel listed \
            --firefox-compatibility firefox \
            --firefox-jwt-issuer "$FIREFOX_JWT_ISSUER" \
            --firefox-jwt-secret "$FIREFOX_JWT_SECRET"

      - name: Submit to Chrome Web Store
        if: steps.exists.outputs.skip == 'false' && env.HAS_CWS_KEYS == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
        run: |
          npx wxt submit \
            --chrome-zip dist/*-chrome.zip \
            --chrome-api-version v2 \
            --chrome-extension-id "$CHROME_EXTENSION_ID" \
            --chrome-publisher-id "$CHROME_PUBLISHER_ID" \
            --chrome-service-account-client-email "$CHROME_SERVICE_ACCOUNT_EMAIL" \
            --chrome-service-account-private-key "$CHROME_SERVICE_ACCOUNT_KEY"
